<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global YouTube Radar</title><link rel="stylesheet" href="style.css"></head><body><header><div><h1>◉ Global YouTube Radar</h1><p>전 세계 YouTube 조회수 급상승 탐색기</p></div><button id="refresh">데이터 새로고침</button></header><main><section class="controls"><select id="region"><option value="ALL">🌎 전 세계</option><option value="KR">🇰🇷 한국</option><option value="US">🇺🇸 미국</option><option value="JP">🇯🇵 일본</option><option value="GB">🇬🇧 영국</option><option value="IN">🇮🇳 인도</option><option value="BR">🇧🇷 브라질</option><option value="DE">🇩🇪 독일</option><option value="FR">🇫🇷 프랑스</option></select><select id="type"><option value="all">전체 영상</option><option value="shorts">Shorts</option><option value="long">일반 영상</option></select><select id="metric"><option value="d10">최근 10분</option><option value="d1" selected>최근 1시간</option><option value="d6">최근 6시간</option><option value="d24">최근 24시간</option></select><select id="limit"><option>100</option><option>200</option><option>300</option><option>400</option><option>500</option></select><input id="search" placeholder="영상 또는 채널 검색"></section><div id="status"></div><section id="list"></section></main><script src="app.js"></script></body></html>
